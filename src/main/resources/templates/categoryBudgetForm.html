<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>カテゴリ予算登録</title>
    </head>
    <body>
        <h1>カテゴリ予算登録</h1>
        <form th:action="${categoryId == null}
                        ? @{/budgets/categoryBudget}
                        : @{/budgets/categoryBudget/edit/categories/{categoryId}/month/{targetMonth}(categoryId=${categoryId}, targetMonth=${targetMonth})}"
                    th:object="${categoryBudgetForm}"
                    method="post">
                <label for="categoryName">カテゴリ名</label>
                <select id="categoryId" th:field="*{categoryId}" required>
                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                </select><br>

                <label for="budgetAmount">予算額</label>
                <input type="number" id="budgetAmount" th:field="*{budgetAmount}" required><br>

                <label for="targetMonth">対象月</label>
                <input type="month" id="targetMonth" th:field="*{targetMonth}" required><br>

                <button type="submit"
                        th:text="${categoryId == null} ? '登録' : '更新'"></button>
                <button type="button" onclick="location.href='/budgets/categoryBudget'">キャンセル</button>
        </form>

    </body>
</html>
