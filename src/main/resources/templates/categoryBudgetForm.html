<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カテゴリ別予算登録・編集</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/category-budget.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header('categoryBudget')}"></header>

    <main class="container category-budget-page">
        <div class="page-header">
            <div>
                <h1 th:text="${categoryId == null} ? 'カテゴリ別予算の登録' : 'カテゴリ別予算の編集'">
                    カテゴリ別予算の登録
                </h1>
                <p class="text-secondary">
                    カテゴリごとの予算額を設定します。
                </p>
            </div>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <section class="card category-budget-form-card">
            <form th:action="${categoryId == null}
                            ? @{/budgets/categoryBudget}
                            : @{/budgets/categoryBudget/edit/categories/{categoryId}/month/{targetMonth}(categoryId=${categoryId}, targetMonth=${targetMonth})}"
                    th:object="${categoryBudgetForm}"
                    method="post">

                <div class="form-group">
                    <label for="categoryId">カテゴリ</label>
                    <select id="categoryId"
                            th:field="*{categoryId}"
                            th:disabled="${categoryId != null}"
                            required>
                        <option value="">カテゴリを選択してください</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}">
                        </option>
                    </select>

                    <input th:if="${categoryId != null}"
                            type="hidden"
                            name="categoryId"
                            th:value="${categoryId}">

                    <p class="form-hint">
                        予算を設定するカテゴリを選択してください。
                    </p>
                    <p class="field-error"
                        th:if="${#fields.hasErrors('categoryId')}"
                        th:errors="*{categoryId}">
                    </p>
                </div>

                <div class="form-group">
                    <label for="budgetAmount">予算額</label>
                    <div class="amount-input">
                        <input type="number"
                                id="budgetAmount"
                                th:field="*{budgetAmount}"
                                min="1"
                                step="1"
                                placeholder="例：30000"
                                required>
                        <span>円</span>
                    </div>
                    <p class="form-hint">
                        カテゴリに割り当てる予算額を入力してください。
                    </p>
                    <p class="field-error"
                        th:if="${#fields.hasErrors('budgetAmount')}"
                        th:errors="*{budgetAmount}">
                    </p>
                </div>

                <div class="form-group">
                    <label for="targetMonth">対象月</label>
                    <input type="month"
                            id="targetMonth"
                            th:field="*{targetMonth}"
                            th:readonly="${categoryId != null}"
                            required>
                    <p class="form-hint">
                        予算を設定する月を選択してください。
                    </p>
                    <p class="field-error"
                        th:if="${#fields.hasErrors('targetMonth')}"
                        th:errors="*{targetMonth}">
                    </p>
                </div>

                <div class="form-actions">
                    <a class="btn btn-outline"
                        th:href="@{/budgets/categoryBudget}">
                        キャンセル
                    </a>
                    <button class="btn btn-primary"
                            type="submit"
                            th:text="${categoryId == null} ? '登録する' : '更新する'">
                        登録する
                    </button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
