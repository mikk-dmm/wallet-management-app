<!DOCTYPE html>
<html lang="ja" xmlns="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>月別予算登録</title>
    </head>
    <body>
        <h1>月別予算登録</h1>
        <form th:action="${monthlyBudgetForm.targetMonth == null}
                        ? @{/budgets/monthlyBudget}
                        : @{/budgets/monthlyBudget/edit/{targetMonth}(targetMonth=${monthlyBudgetForm.targetMonth})}"
                th:object="${monthlyBudgetForm}"
                method="post">
            <label for="targetMonth">対象月</label>
            <input type="month" id="targetMonth" th:field="*{targetMonth}" required><br>

            <label for="budgetAmount">予算額</label>
            <input type="number" id="budgetAmount" th:field="*{budgetAmount}" required><br>

            <button type="submit"
                    th:text="${targetMonth == null} ? '登録' : '更新'"></button>
            <button type="button" onclick="location.href='/budgets/monthlyBudget'">キャンセル</button>
        </form>
    </body>
</html>
