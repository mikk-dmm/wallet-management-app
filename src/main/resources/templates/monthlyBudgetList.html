<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, inicial-scale=1.0">
        <title>月別予算一覧</title>
    </head>
    <body>
        <h1>月別予算一覧</h1>
        <button onclick="location.href='/dashboard'">ダッシュボードに戻る</button>
        <button onclick="location.href='/budgets/monthlyBudget/new'">新規予算登録</button>
        <p th:if="${errorMessage}" th:text="${errorMessage}">すでに登録されています</p>
        
        <table>
            <thead>
                <tr>
                    <th>月</th>
                    <th>予算額</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="monthlyBudget : ${monthlyBudgets}">
                    <td th:text="${monthlyBudget.targetMonth}"></td>
                    <td th:text="${monthlyBudget.budgetAmount}">円</td>
                    <td>
                        <a th:href="@{/budgets/monthlyBudget/edit/{targetMonth}(targetMonth=${monthlyBudget.targetMonth})}">編集</a>
                    </td>
                    <td>
                        <form th:action="@{/budgets/monthlyBudget/{targetMonth}/delete(targetMonth=${monthlyBudget.targetMonth})}"
                            method="post"
                            onsubmit="return confirm('予算を削除しますか？')">
                            <button type="submit">削除</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
