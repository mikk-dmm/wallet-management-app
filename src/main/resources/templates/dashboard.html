<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ダッシュボード</title>
    </head>
    <body>
        
        <h1>ダッシュボード</h1>

        <p>
            <span th:text="${dashboard.targetMonth}"></span>
            のダッシュボード
        </p>

        <p>
            月予算：
            <span th:text="${dashboard.monthlyBudget}"></span>
        </p>

        <p>
            支出合計：
            <span th:text="${dashboard.monthlyExpenseTotal}"></span>
        </p>

        <p>
            残額：
            <span th:text="${dashboard.remainingAmount}"></span>
        </p>
    </body>
</html>
