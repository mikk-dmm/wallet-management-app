<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カテゴリ登録・編集</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/category.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header('categories')}"></header>

    <main class="container category-page">
        <div class="page-header">
            <div>
                <h1 th:text="${editMode} ? 'カテゴリの編集' : 'カテゴリの登録'">
                    カテゴリの登録
                </h1>
                <p class="text-secondary">
                    支出を分類するカテゴリ名を設定します。
                </p>
            </div>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <section class="card category-form-card">
            <form th:action="${editMode == false}
                            ? @{/categories}
                            : @{/category/edit/{id}(id=${categoryId})}"
                    th:object="${categoryForm}"
                    method="post">

                <div class="form-group">
                    <label for="name">カテゴリ名</label>

                    <input type="text"
                            id="name"
                            th:field="*{name}"
                            maxlength="30"
                            placeholder="例：食費"
                            required>

                    <p class="form-hint">
                        家計の支出を分類するための名前を入力してください。
                    </p>
                    <p class="field-error"
                        th:if="${#fields.hasErrors('name')}"
                        th:errors="*{name}">
                    </p>
                </div>

                <div class="form-actions">
                    <a class="btn btn-outline" th:href="@{/categories}">
                        キャンセル
                    </a>

                    <button type="submit"
                            class="btn btn-primary"
                            th:text="${editMode} ? '更新する' : '登録する'">
                        登録する
                    </button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
