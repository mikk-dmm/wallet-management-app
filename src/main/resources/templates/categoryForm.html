<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>カテゴリ登録</title>
    </head>
    <body>
        <h1>カテゴリ登録</h1>
        <form th:action="${editMode == false}
                        ? @{/categories}
                        : @{/category/edit/{id}(id=${categoryId})}"
                th:object="${categoryForm}"
                method="post">
            <label for="name">カテゴリ名</label>
            <input type="text" id="name" th:field="*{name}" required><br>

            <button type="submit"
                    th:text="${editMode == false} ? '登録' : '更新'"></button>
            <a th:href="@{/categories}">キャンセル</a>
            </form>
    </body>
</html>
