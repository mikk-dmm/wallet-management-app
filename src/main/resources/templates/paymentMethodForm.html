<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支払い方法登録・編集</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/payment-method.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header('paymentMethods')}"></header>

    <main class="container payment-method-page">
        <div class="page-header">
            <div>
                <h1 th:text="${editMode} ? '支払い方法の編集' : '支払い方法の登録'">
                    支払い方法の登録
                </h1>
                <p class="text-secondary">
                    支出の記録に使用する支払い方法を設定します。
                </p>
            </div>
        </div>
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <section class="card payment-method-form-card">
            <form th:action="${editMode == false}
                            ? @{/paymentMethods}
                            : @{/paymentMethod/edit/{id}(id=${id})}"
                    th:object="${paymentMethodForm}"
                    method="post">

                <div class="form-group">
                    <label for="name">支払い方法名</label>

                    <input type="text"
                            id="name"
                            th:field="*{name}"
                            placeholder="例：現金、クレジットカード"
                            required>

                    <p class="form-hint">
                        支出を登録するときに選択する名前を入力してください。
                    </p>
                    <p class="field-error"
                        th:if="${#fields.hasErrors('name')}"
                        th:errors="*{name}">
                    </p>
                </div>

                <div class="form-actions">
                    <a class="btn btn-outline" th:href="@{/paymentMethods}">
                        キャンセル
                    </a>

                    <button type="submit"
                            class="btn btn-primary"
                            th:text="${editMode} ? '更新する' : '登録する'">
                        登録する
                    </button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
