<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>支払い方法登録</title>
    </head>
    <body>
        <h1>支払い方法登録</h1>
        <form th:action="${editMode == false}
                        ? @{/paymentMethods}
                        : @{/paymentMethod/edit/{id}(id=${id})}"
                th:object="${paymentMethodForm}"
                method="post">
            <label for="name">支払い方法</label>
            <input type="text" id="name" th:field="*{name}" required><br>

            <button type="submit"
                    th:text="${editMode == false} ? '登録' : '更新'"></button>
            <a th:href="@{/paymentMethods}">キャンセル</a>
            </form>
    </body>
</html>
