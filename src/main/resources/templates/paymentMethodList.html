<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device=width, initial-scale=1.0">
        <title>支払い方法一覧</title>
    </head>
    <body>
        <h1>支払い方法一覧</h1>
        <a th:href="@{/dashboard}">ダッシュボードに戻る</a>
        <a th:href="@{/paymentMethod/new}">新規登録</a>
        <p th:if="${errorMessage}" th:text="${errorMessage}">すでに登録されています</p>

        <table>
            <thead>
                <tr>
                    <th>支払い方法</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="paymentMethod : ${paymentMethods}">
                    <td th:text="${paymentMethod.name}"></td>
                    <td>
                        <a th:href="@{/paymentMethod/edit/{id}(id=${paymentMethod.id})}">編集</a>
                    </td>
                    <td>
                        <form th:action="@{/paymentMethod/{id}/delete(id=${paymentMethod.id})}"
                                method="post"
                                onsubmit="return confirm('支払い方法を削除しますか')">
                            <button type="submit">削除</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
