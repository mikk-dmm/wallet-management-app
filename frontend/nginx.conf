server {
    listen 80;
    server_name wallet-mkk.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name wallet-mkk.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/wallet-mkk.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet-mkk.duckdns.org/privkey.pem;

    location = / {
        return 302 /login;
    }

    # Reactの静的ファイル
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location = /expenditures {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # REST API
    location /api/ {
        proxy_pass http://springboot:8080;
    }

    # ログイン
    location /login {
        proxy_pass http://springboot:8080;
    }

    # ログアウト
    location /logout {
        proxy_pass http://springboot:8080;
    }

    # Dashboard
    location /dashboard {
        proxy_pass http://springboot:8080;
    }

    # Category
    location /category {
        proxy_pass http://springboot:8080;
    }
    location /categories {
        proxy_pass http://springboot:8080;
    }

    # Payment Method
    location /paymentMethod {
        proxy_pass http://springboot:8080;
    }

    # 月次予算・カテゴリ予算
    location /budgets/ {
        proxy_pass http://springboot:8080;
    }

    # Spring Bootが配信するCSS
    location /css/ {
    proxy_pass http://springboot:8080;
    }
}