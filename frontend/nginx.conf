server {
    listen 80;

    absolute_redirect off;

    proxy_set_header Host $http_host;

    location = / {
        return 302 /login;
    }

    # Reactの静的ファイル
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location = /expenditures {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # REST API
    location /api/ {
        proxy_pass http://springboot:8080;
    }

    # ログイン
    location /login {
        proxy_pass http://springboot:8080;
    }

    # ログアウト
    location /logout {
        proxy_pass http://springboot:8080;
    }

    # Dashboard
    location /dashboard {
        proxy_pass http://springboot:8080;
    }

    # Category
    location /category {
        proxy_pass http://springboot:8080;
    }
    location /categories {
        proxy_pass http://springboot:8080;
    }

    # Payment Method
    location /paymentMethod {
        proxy_pass http://springboot:8080;
    }

    # 月次予算・カテゴリ予算
    location /budgets/ {
        proxy_pass http://springboot:8080;
    }
}